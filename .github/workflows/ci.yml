name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
      - name: Acceptance suite
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/agent-ops-clean
          /tmp/agent-ops-clean/bin/python -m pip install dist/*.whl
          /tmp/agent-ops-clean/bin/agent-ops --version
      - name: CLI version
        run: agent-ops --version
