[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops-kit"
version = "0.1.0"
description = "Evidence-gated operations for local AI agent stacks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Joel Brilliant" }]
keywords = ["github", "agents", "ops", "maintenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0"]

[project.scripts]
agent-ops = "agent_ops.cli:main"

[project.urls]
Homepage = "https://github.com/joelbrilliant/agent-ops-kit"
Repository = "https://github.com/joelbrilliant/agent-ops-kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
