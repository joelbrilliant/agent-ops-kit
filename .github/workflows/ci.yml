name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
      - name: Synthetic suite
        run: python -m pytest -q
      - name: CLI version
        run: agent-ops --version
