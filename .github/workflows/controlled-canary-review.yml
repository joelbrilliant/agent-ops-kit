name: controlled-canary-review

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Post one controlled inline finding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='CONTROLLED_CANARY: this intentionally makes lookup case-sensitive.'
          path='src/agent_ops/config.py'
          line="$(grep -nF "$marker" "$path" | cut -d: -f1)"
          if [ -z "$line" ]; then
            exit 0
          fi
          existing="$(gh api \
            "repos/$GH_REPOSITORY/pulls/$PR_NUMBER/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("[controlled canary]")) | .id' \
            | head -n 1)"
          if [ -n "$existing" ]; then
            exit 0
          fi
          gh api \
            --method POST \
            "repos/$GH_REPOSITORY/pulls/$PR_NUMBER/comments" \
            -f body='[controlled canary] This makes repository policy lookup case-sensitive even though policy keys are normalised to lowercase. Please normalise the repository name before lookup.' \
            -f commit_id="$HEAD_SHA" \
            -f path="$path" \
            -F line="$line" \
            -f side='RIGHT'
